[build-system]
requires = ["uv_build>=0.10.5,<0.12.0"]
build-backend = "uv_build"

[project]
name = "strands-teams"
version = "3.0.0"
description = "A domain-agnostic agent-teams framework on strands-agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "rich>=14.3.3",
    "strands-agents>=1.47",
]
