[build-system]
requires = ["uv_build>=0.10.5,<0.12.0"]
build-backend = "uv_build"

[project]
name = "strands-teams-runtimes"
version = "3.0.0"
description = "SpecialistRuntime adapters (Claude Opus 4.8 + Codex GPT-5.6 Sol on Bedrock) for strands-teams"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.1.60",
    "openai-codex",
    "strands-teams",
]

[tool.uv.sources]
strands-teams = { workspace = true }
